<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusSense AI Monitor</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-family: monospace;
    }
    .status-active {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-idle {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .metric-val {
      font-weight: 600;
      color: #f1f5f9;
      font-family: monospace;
    }
    .category-tag {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
    }
    .tag-study { background: #065f46; color: #6ee7b7; }
    .tag-distraction { background: #991b1b; color: #fca5a5; }
    .tag-unknown { background: #374151; color: #d1d5db; }
    .privacy-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #1e293b;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">FocusSense AI</div>
    <div id="statusBadge" class="status-badge status-idle">
      <span class="dot"></span>
      <span id="statusText">Idle</span>
    </div>
  </div>

  <div id="sessionDetails">
    <div class="metric-row">
      <span>Session:</span>
      <span id="sessionId" class="metric-val">None</span>
    </div>
    <div class="metric-row">
      <span>Subject:</span>
      <span id="subjectName" class="metric-val">—</span>
    </div>
    <div class="metric-row">
      <span>Current Domain:</span>
      <span id="activeDomain" class="metric-val">—</span>
    </div>
    <div class="metric-row">
      <span>Category:</span>
      <span id="activeCategory" class="category-tag tag-unknown">—</span>
    </div>
    <div class="metric-row">
      <span>Tab Switches:</span>
      <span id="switchCount" class="metric-val">0</span>
    </div>
  </div>

  <div class="privacy-box">
    🔒 <strong>Privacy Guard:</strong> Monitors only active tab domains during explicit study sessions. No passwords, page contents, keystrokes, or search histories are ever recorded.
  </div>

  <script src="popup.js"></script>
</body>
</html>
